services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    init: true
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_UI_ORIGIN: ${OPENCLAW_UI_ORIGIN:-http://careathome:18789}
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: Australia/Perth
    ports:
      - "${OPENCLAW_BIND_ADDRESS:-0.0.0.0}:18789:18789"
    configs:
      - source: openclaw_config
        target: /etc/openclaw/openclaw.json
    volumes:
      - openclaw_state:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
      - openclaw_auth:/home/node/.config/openclaw
    networks:
      - ai_backend
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:18789/healthz')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    profiles: [admin]
    image: ghcr.io/openclaw/openclaw:latest
    network_mode: service:openclaw-gateway
    init: true
    stdin_open: true
    tty: true
    entrypoint: ["node", "dist/index.js"]
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_UI_ORIGIN: ${OPENCLAW_UI_ORIGIN:-http://careathome:18789}
      BROWSER: echo
      TZ: Australia/Perth
    configs:
      - source: openclaw_config
        target: /etc/openclaw/openclaw.json
    volumes:
      - openclaw_state:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
      - openclaw_auth:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    depends_on:
      openclaw-gateway:
        condition: service_healthy

configs:
  openclaw_config:
    file: ./openclaw.json

networks:
  ai_backend:
    external: true
    name: ai_backend

volumes:
  openclaw_state:
    name: openclaw_state
  openclaw_workspace:
    name: openclaw_workspace
  openclaw_auth:
    name: openclaw_auth
